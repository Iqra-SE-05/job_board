<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JobBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">Job<span>Board</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#jobs">Jobs</a>
        <a href="post-job.html">Post a Job</a>
        <a href="login.html" class="btn btn-outline">Login</a>
      </nav>
    </div>
  </header>

  <main class="container detail-page">
    <div class="detail-card auth-card">
      <h1 id="auth-title">Company Login</h1>
      <p class="muted" id="auth-sub">Log in to post jobs and manage applicants.</p>

      <form id="auth-form">
        <div id="name-row" style="display:none;">
          <label for="company-name">Company Name</label>
          <input type="text" id="company-name" placeholder="e.g. TechNova">
        </div>

        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="company@example.com" required>

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="At least 6 characters" required>

        <button type="submit" id="auth-btn" class="btn btn-primary">Login</button>
      </form>

      <p id="auth-error" class="error-msg" style="display:none;"></p>

      <p class="auth-switch">
        <span id="switch-text">Don't have an account?</span>
        <a href="#" id="switch-link">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 JobBoard. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="nav.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
