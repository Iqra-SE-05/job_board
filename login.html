<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JobBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo"><img src="logo.svg" alt="JobBoard"></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="jobs.html">Find Jobs</a>
        <a href="post-job.html">Post a Job</a>
        <a href="login.html" class="btn btn-outline">Login</a>
      </nav>
    </div>
  </header>

  <main class="container detail-page">
    <div class="detail-card auth-card">
      <h1 id="auth-title">Login</h1>
      <p class="muted" id="auth-sub">Log in to apply for jobs or manage your company.</p>

      <form id="auth-form">
        <div id="signup-extra" style="display:none;">
          <label>I am a</label>
          <div class="role-pick">
            <label class="role-option"><input type="radio" name="role" value="applicant" checked> Job Seeker</label>
            <label class="role-option"><input type="radio" name="role" value="company"> Company</label>
          </div>

          <label for="company-name" id="name-label">Full Name</label>
          <input type="text" id="company-name" placeholder="Your name">
        </div>

        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" required>

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="At least 6 characters" required>

        <button type="submit" id="auth-btn" class="btn btn-primary">Login</button>
      </form>

      <p id="auth-error" class="error-msg" style="display:none;"></p>

      <p class="auth-switch">
        <span id="switch-text">Don't have an account?</span>
        <a href="#" id="switch-link">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 JobBoard. All rights reserved.</div>
    </div>
  </footer>

  <script type="module" src="nav.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>
