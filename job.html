<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Details - JobBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="index.html" class="logo">Job<span>Board</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#jobs">Jobs</a>
       <a href="post-job.html">Post a Job</a>
        <a href="#" class="btn btn-outline">Login</a>
      </nav>
    </div>
  </header>

  <!-- Job Detail -->
  <main class="container detail-page">
    <a href="index.html" class="back-link">&larr; Back to all jobs</a>

    <div id="job-detail" class="detail-card"></div>

    <div id="apply-section" class="detail-card">
      <h2>Apply for this job</h2>
      <form id="apply-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="03xx xxxxxxx" required>

                <label for="resumeFile">Upload Resume (PDF, DOC or DOCX, max 700 KB)</label>
        <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">

        <label for="resume">Or paste Resume Link (Google Drive / LinkedIn)</label>
        <input type="url" id="resume" placeholder="https://...">
        <label for="message">Cover Letter (optional)</label>
        <textarea id="message" rows="4" placeholder="Why are you a good fit?"></textarea>

        <button type="submit" class="btn btn-primary">Submit Application</button>
      </form>
      <p id="success-msg" class="success-msg" style="display:none;"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 JobBoard. All rights reserved.</p>
    </div>
  </footer>

   <script type="module" src="job.js"></script>
</body>
</html>
